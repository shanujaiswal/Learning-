# messages_ja.properties -- Japanese translations.
# Demonstrates a non-Latin-script locale. Since Java 9, ResourceBundle.getBundle
# reading .properties files defaults to UTF-8, so these characters do not need
# \\uXXXX escaping the way pre-Java-9 code traditionally required (see the
# "Encoding gotcha" note in Theory file 05).
greeting=こんにちは、{0}さん！
farewell=さようなら！
